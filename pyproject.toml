[project]
name = "sofabaton-config"
version = "0.1.0"
description = "Keep a Sofabaton X2 hub's configuration in files: export, plan, apply, restore"
requires-python = ">=3.11"
# sofabaton-x speaks the hub's protocol and plans/applies edits; pinned because
# the file format follows its hub_bundle schema.
dependencies = ["sofabaton-x==0.2.6"]

[project.scripts]
hubconfig = "sofabaton_config:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["sofabaton_config.py"]
